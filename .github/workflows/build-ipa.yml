# Manic X Stage 1 — unsigned IPA build (no companion)
#
# STAGE1-X: Builds the Stage 1 fork (top-only 3DS layout + tuned Pokemon X
# profile, no companion) on a GitHub-hosted macOS runner and uploads an
# UNSIGNED .ipa as a workflow artifact.
#
# The IPA is deliberately UNSIGNED (CODE_SIGNING_ALLOWED=NO). No Apple
# credentials, certificates, provisioning profiles, or secrets are used
# anywhere in this workflow. After downloading the artifact, re-sign it
# on a PC with Sideloadly (or AltStore) using your own Apple ID, exactly
# as with the stock Manic SideloadJIT IPA. The bundle ID is
# com.aoshuang.manicemu (Config-Base.xcconfig), so a re-signed install
# replaces the existing sideloaded Manic rather than using a new app slot.
#
# Trigger: Actions tab -> "Build Manic X Stage 1 IPA" -> Run workflow.
# This workflow does NOT run on push, so a stray commit cannot burn
# macOS runner minutes.
#
# Known requirements (see STAGE1-REPORT-2026-11-18.md):
# - The repo this runs in must contain the Stage 1 fork, including the
#   .gitattributes LFS entries. The checkout step pulls the LFS
#   frameworks (Cores/*.framework) and initialises submodules
#   (Dependencies/Libretro, which holds the LibretroCore wrapper source).
# - iOS builds cannot be verified on Linux; this workflow is the first
#   real compile check. Expect the first run to surface Xcode-version or
#   signing-adjacent issues; fix them in the workflow, not by adding
#   credentials.

name: Build Manic X Stage 1 IPA

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: xcode-27
    # Build #9 (macos-15, Xcode 26.3 / iOS 26.2 SDK) proved upstream Manic HEAD
    # needs the iOS 27.1 SDK: DuoHingeKit.swift is @available(iOS 27.1, *) and
    # uses UIHinge/UIHingeInteraction, which do not exist in any Xcode 26 SDK.
    # macos-15 tops out at Xcode 26.3 and macos-26 at Xcode 26.6, so neither
    # can build this code. The xcode-27 image (preview, issue #14404) is the
    # only GitHub-hosted runner with Xcode 27; its default Xcode is 27.x, so
    # no xcode-select step is needed. Queue times may be longer (preview).
    steps:
      - name: Check out fork (with LFS frameworks + submodules)
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
          fetch-depth: 1

      # Manic addition (Pokemon X companion): the guest-memory read path lives
      # in the Libretro submodule (Daiuno/RetroArch, pinned commit), which this
      # repo cannot modify directly. patches/libretro-memory-read.patch adds
      # LibretroCore.readGuestMemoryAtAddress:length:intoBuffer: to the
      # submodule's working tree. --check first so a patch that no longer
      # applies fails here loudly instead of as a confusing compile error.
      # The patch is written against the pinned submodule commit (manicemu
      # d08135f); if the pin ever moves, rebase the patch, don't delete it.
      - name: Apply Manic memory-read patch to Libretro submodule
        run: |
          cd Dependencies/Libretro
          git apply --check ../../patches/libretro-memory-read.patch
          git apply ../../patches/libretro-memory-read.patch
          git status --short

      # xcode-27's default Xcode is 27.x (iOS 27 SDK); no xcode-select step.
      # If the default ever regresses, re-add: sudo xcode-select -s /Applications/Xcode_27*.app
      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks | head -20

      - name: Verify LFS frameworks are real files, not pointers
        run: |
          file ManicEmu/../Cores/azahar.libretro.framework/azahar.libretro || true
          # LFS pointer files are ~130 bytes of text; a real framework binary is MBs.
          find Cores -name "*.framework" -maxdepth 1 | head
          du -sh Cores/azahar.libretro.framework Cores/Citra.framework

      - name: Archive (unsigned, Sideload scheme)
        run: |
          xcodebuild \
            -project ManicEmu/ManicEmu.xcodeproj \
            -scheme ManicEmuSideload \
            -configuration SideloadRelease \
            -destination 'generic/platform=iOS' \
            -archivePath build/ManicEmu.xcarchive \
            -skipPackagePluginValidation \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA from the archive
        run: |
          APP_PATH="build/ManicEmu.xcarchive/Products/Applications/ManicEmuSideload.app"
          ls -la "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # The .app is unsigned; Sideloadly/AltStore re-signs it on install.
          zip -r -y ManicEmu-X-Stage1-unsigned.ipa Payload
          ls -lh ManicEmu-X-Stage1-unsigned.ipa
          unzip -l ManicEmu-X-Stage1-unsigned.ipa | head -20

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ManicEmu-X-Stage1-unsigned
          path: ManicEmu-X-Stage1-unsigned.ipa
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/
          retention-days: 7
